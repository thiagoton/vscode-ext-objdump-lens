<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Objdump Lens</title>
  <defs>
    <clipPath id="glass"><circle cx="108" cy="108" r="62"/></clipPath>
  </defs>
  <!-- background -->
  <rect x="4" y="4" width="248" height="248" rx="56" fill="#0d1117" stroke="#30363d" stroke-width="3"/>

  <!-- lens glass: source (green) over assembly (blue) -->
  <g clip-path="url(#glass)">
    <rect x="40" y="40" width="136" height="68" fill="#2ea043"/>
    <rect x="40" y="108" width="136" height="68" fill="#388bfd"/>
  </g>

  <!-- top: C/C++ braces -->
  <g fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path id="brace" transform="translate(92 62)"
          d="M6 0 C1 0 -1 2 -1 7 V14 C-1 18 -4 20 -7 20 C-4 20 -1 22 -1 26 V33 C-1 38 1 40 6 40"/>
    <path transform="translate(124 62) scale(-1 1)"
          d="M6 0 C1 0 -1 2 -1 7 V14 C-1 18 -4 20 -7 20 C-4 20 -1 22 -1 26 V33 C-1 38 1 40 6 40"/>
    <!-- bottom: machine code "01" -->
    <ellipse cx="94" cy="138" rx="9" ry="14"/>
    <path d="M114 130 L124 123 V153"/>
  </g>

  <!-- divider -->
  <line x1="40" y1="108" x2="176" y2="108" stroke="#0d1117" stroke-width="4" clip-path="url(#glass)"/>

  <!-- ring + handle -->
  <circle cx="108" cy="108" r="62" fill="none" stroke="#e6edf3" stroke-width="14"/>
  <line x1="154" y1="154" x2="208" y2="208" stroke="#e6edf3" stroke-width="24" stroke-linecap="round"/>
</svg>
