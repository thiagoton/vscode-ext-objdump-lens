<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente do fundo principal -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e222a" />
      <stop offset="100%" stop-color="#0f1115" />
    </linearGradient>

    <!-- Gradiente do aro da lupa -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f3f8" />
      <stop offset="50%" stop-color="#b0b8c5" />
      <stop offset="100%" stop-color="#7a8494" />
    </linearGradient>

    <!-- Gradiente do cabo da lupa -->
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d6dce5" />
      <stop offset="50%" stop-color="#8a94a6" />
      <stop offset="100%" stop-color="#4e5666" />
    </linearGradient>

    <!-- Sombra projetada da lupa -->
    <filter id="dropShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Clipping da lente para divisão do círculo -->
    <clipPath id="lensClip">
      <circle cx="210" cy="210" r="105" />
    </clipPath>
  </defs>

  <!-- Base com cantos arredondados (Ícone de Extensão VS Code) -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" />

  <!-- Código de fundo (Simula a listagem objdump -S) -->
  <g fill="#61afef" font-family="monospace" font-size="15" font-weight="600" opacity="0.45">
    <text x="36" y="70" fill="#e06c75">00000418 &lt;main&gt;:</text>
    <text x="36" y="98" fill="#98c379">  int x = 5;</text>
    <text x="36" y="126">  4010a0: 48 8b 05     mov  0x3d1(%rip),%rax</text>
    <text x="36" y="154">  4010a7: 48 89 c7     mov  %rax,%rdi</text>

    <text x="36" y="190" fill="#98c379">  for (int i=0; i&lt;10; i++) {</text>
    <text x="36" y="218">  4010af: e8 d1 32     call 404380 &lt;func&gt;</text>
    <text x="36" y="246">  4010b4: 83 c0 02     add  $0x2,%eax</text>

    <text x="36" y="282" fill="#e06c75">00000442 &lt;process_data&gt;:</text>
    <text x="36" y="310" fill="#98c379">  return x + 2;</text>
    <text x="36" y="338">  401112: 8b 45 f4     mov  -0xc(%rbp),%eax</text>
    <text x="36" y="366">  401115: 83 c0 02     add  $0x2,%eax</text>

    <text x="36" y="402">  401118: 48 83 c4 08  add  $0x8,%rsp</text>
    <text x="36" y="430">  40111c: c3           retq</text>
    <text x="36" y="458" fill="#98c379">}</text>
  </g>

  <!-- Lupa com Sombra -->
  <g filter="url(#dropShadow)">
    <!-- Cabo da Lupa -->
    <path d="M 292 292 L 410 410" stroke="url(#handleGrad)" stroke-width="42" stroke-linecap="round" />
    <path d="M 292 292 L 410 410" stroke="#2a303c" stroke-width="26" stroke-linecap="round" opacity="0.3" />

    <!-- Anel Exterior de Metal da Lupa -->
    <circle cx="210" cy="210" r="120" fill="url(#rimGrad)" />
    <circle cx="210" cy="210" r="108" fill="#181a1f" />

    <!-- Lente Interna Dividida em Duas Secções -->
    <g clip-path="url(#lensClip)">
      <!-- Metade Superior (Verde - C/C++) -->
      <rect x="95" y="95" width="230" height="115" fill="#28a745" />
      <!-- Metade Inferior (Azul - ASM) -->
      <rect x="95" y="210" width="230" height="115" fill="#007acc" />
      <!-- Linha do Divisor -->
      <line x1="95" y1="210" x2="325" y2="210" stroke="#000000" stroke-width="3" opacity="0.4" />
    </g>

    <!-- Textos na Lente -->
    <!-- C/C++ -->
    <text x="210" y="172" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#ffffff" text-anchor="middle">C/C++</text>
    
    <!-- ASM -->
    <text x="210" y="278" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">ASM</text>

    <!-- Brilho/Reflexo de Vidro na Lupa -->
    <path d="M 125 125 A 105 105 0 0 1 295 145 A 105 105 0 0 0 125 125 Z" fill="#ffffff" opacity="0.25" />
  </g>
</svg>